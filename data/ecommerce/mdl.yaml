schema_version: 1
# 语义层（唯一权威）：外号/模型 → SQL；度量 → 指标 → 比率。
# 机器可读；技能卡与文档由它生成，不手写第二份。

models:
  - name: fct_sales_line
    description: 已支付订单商品行（一行=一件商品，每行有唯一 order_item_id）。GMV、订单数、品类/商品拆解都在此算
    provider: sqlite
    grain: order_item
    key: [order_item_id]
    entity: product
    ref_sql: |
      SELECT oi.order_item_id, oi.order_id, oi.product_id, oi.category,
             oi.amount, o.pay_time
      FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
      WHERE o.shop_id = 1 AND o.status = 'paid'
    columns:
      - {name: order_item_id, unit: 标识}
      - {name: order_id,   unit: 标识}
      - {name: product_id, unit: 标识}
      - {name: category,   unit: 文本}
      - {name: amount,     unit: 元}
      - {name: pay_time,   unit: 时间}
    dimensions: [category, product_id, pay_time]

  - name: products
    description: 商品维表（当前品类）。注意是"当前品类"，与下单时品类可能不同
    provider: sqlite
    grain: product
    key: [product_id]
    entity: product
    table: products
    columns:
      - {name: product_id,   unit: 标识}
      - {name: product_name, unit: 文本}
      - {name: category,     unit: 文本}
    dimensions: [product_id, category, product_name]

  - name: fct_orders
    description: 已支付订单（一行=一张订单）。订单级分析在这算；注意它没有品类列（品类属于商品行）
    provider: sqlite
    grain: order
    key: [order_id]
    entity: order
    ref_sql: |
      SELECT o.order_id, o.pay_time
      FROM orders o
      WHERE o.shop_id = 1 AND o.status = 'paid'
    columns:
      - {name: order_id, unit: 标识}
      - {name: pay_time, unit: 时间}
    dimensions: [pay_time]

  - name: shop_traffic
    description: 自店渠道流量（平台侧，仅 MCP 可达）。有 date/source 维度，没有 category——按品类拆访客非法
    provider: platform_mcp
    mcp_tool: get_shop_traffic
    grain: date_source
    key: [date, source]
    entity: source
    columns:
      - {name: date,    unit: 时间}
      - {name: source,  unit: 文本}
      - {name: visitors, unit: 人}
    dimensions: [date, source]

measures:
  - name: sales_amount
    model: fct_sales_line
    agg: sum
    column: amount
    unit: 元
    additivity: additive
    description: 商品支付金额——SUM(amount)，仅已支付/本店，不含退款
  - name: paid_order_count
    model: fct_sales_line
    agg: count
    distinct: order_id
    unit: 单
    additivity: non_additive
    description: 去重支付订单数——COUNT(DISTINCT order_id)
  - name: paid_order_rows
    model: fct_orders
    agg: count
    distinct: order_id
    unit: 单
    additivity: non_additive
    description: 支付订单数（订单粒度模型上的口径，与 paid_order_count 应相等——恒等校验用）
  - name: visitor_count
    model: shop_traffic
    agg: sum
    column: visitors
    unit: 人
    additivity: additive
    description: 访客数——平台口径 SUM(visitors)，按天×渠道

metrics:
  - {name: GMV, model: fct_sales_line, measure: sales_amount, unit: 元,
     description: 商品支付金额}
  - {name: 支付订单数, model: fct_sales_line, measure: paid_order_count, unit: 单,
     description: 去重支付订单数}
  - {name: 订单数订单粒度, model: fct_orders, measure: paid_order_rows, unit: 单,
     description: 订单粒度模型上的支付订单数（跨模型验证用）}
  - {name: 访客数, model: shop_traffic, measure: visitor_count, unit: 人,
     description: 自店访客数（平台口径，MCP 提供）}

ratios:
  - {name: 单均金额, expr: GMV / 支付订单数, unit: 元/单,
     description: 每单平均支付金额}
  - {name: 转化率, expr: 支付订单数 / 访客数, unit: 单/人,
     description: 支付订单数÷访客数。跨源比率（本地+平台），公共维度仅 date——按品类拆非法}

identities:
  - name: GMV乘法恒等
    type: derived_identity
    total: GMV
    factors: [访客数, 转化率, 单均金额]
    tolerance: 0.0

reconciliations:
  - name: GMV口径对账
    type: reconciliation_rule
    total: GMV
    factors: [访客数, 转化率, 单均金额]
    tolerance: 0.02
    note: 平台转化率口径若为"买家UV"而非订单口径, 乘积与GMV可能有差

unavailable:
  - {name: 退款率, reason: 退款数据未接入}
  - {name: 库存,   reason: 库存快照未接入}
  - {name: 利润,   reason: 成本数据不存在；禁止从销售额推导}
  - {name: 复购率, reason: 无用户维度数据}
